<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0066cc">
    <meta name="description" content="Check-In Kunjungan - GeoMap CRM">
    
    <title>Check-In - GeoMap Kunjungan Salesman</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/img/pwa-icon-192.png">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/kunjungan.css">
    
    <style>
        .navbar-custom {
            background: #0066cc;
        }
        
        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 15px;
        }
        
        .card-header {
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .form-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-weight: 700;
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-control, .form-select {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        
        .gps-status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .gps-status.loading {
            background: #e3f2fd;
            color: #0066cc;
        }
        
        .gps-status.success {
            background: #d1e7dd;
            color: #198754;
        }
        
        .gps-status.error {
            background: #f8d7da;
            color: #dc3545;
        }
        
        .distance-alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .distance-valid {
            background: #d1e7dd;
            color: #198754;
            border-left: 4px solid #198754;
        }
        
        .distance-invalid {
            background: #f8d7da;
            color: #dc3545;
            border-left: 4px solid #dc3545;
        }
        
        .photo-upload {
            border: 2px dashed #0066cc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .photo-upload:hover {
            background: #f0f7ff;
            border-color: #004ba3;
        }
        
        .photo-upload.active {
            background: #d1e7dd;
            border-color: #198754;
        }
        
        .photo-preview {
            margin-top: 15px;
            position: relative;
        }
        
        .photo-preview img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            max-height: 300px;
        }
        
        .remove-photo {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .rating-stars {
            display: flex;
            gap: 8px;
            font-size: 28px;
        }
        
        .star {
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s ease;
        }
        
        .star.active {
            color: #ffc107;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn-custom {
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-submit {
            background: #28a745;
            color: white;
            grid-column: 1 / -1;
        }
        
        .btn-submit:hover {
            background: #218838;
            color: white;
        }
        
        .btn-cancel {
            background: #e9ecef;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #dee2e6;
            color: #333;
        }
        
        .btn-custom:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }
        
        @media (max-width: 768px) {
            .button-group {
                grid-template-columns: 1fr;
            }
            
            .btn-submit {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <button class="btn btn-link text-white" onclick="window.history.back()">
                <i class="bi bi-chevron-left"></i>
            </button>
            <span class="navbar-brand">Check-In Kunjungan</span>
            <div style="width: 40px;"></div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container-fluid p-3 pb-20">
        <form id="checkinForm">
            <!-- Step 1: Customer Selection -->
            <div class="form-section">
                <div class="section-title">
                    <i class="bi bi-list-check"></i> Pilih Pelanggan
                </div>
                
                <div class="form-group">
                    <label for="customerSelect" class="form-label">Pelanggan <span class="text-danger">*</span></label>
                    <select class="form-select" id="customerSelect" name="customer_id" required>
                        <option value="">-- Pilih Pelanggan --</option>
                    </select>
                </div>
            </div>
            
            <!-- Step 2: GPS Check-In -->
            <div class="form-section">
                <div class="section-title">
                    <i class="bi bi-geo-alt-fill"></i> GPS Check-In
                </div>
                
                <div id="gpsStatus" class="gps-status loading">
                    <span class="spinner-border spinner-border-sm" role="status"></span>
                    <span>Mendeteksi lokasi Anda...</span>
                </div>
                
                <div id="distanceAlert"></div>
                
                <div class="form-group">
                    <label class="form-label">Koordinat Anda</label>
                    <div class="row">
                        <div class="col-6">
                            <input type="text" class="form-control" id="myLatitude" readonly placeholder="Latitude">
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control" id="myLongitude" readonly placeholder="Longitude">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Akurasi GPS</label>
                    <div class="progress" style="height: 20px;">
                        <div class="progress-bar" id="gpsAccuracy" style="width: 0%">-</div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-outline-primary w-100 mb-3" id="btnRefreshGPS">
                    <i class="bi bi-arrow-repeat"></i> Refresh Lokasi
                </button>
            </div>
            
            <!-- Step 3: Store Condition -->
            <div class="form-section">
                <div class="section-title">
                    <i class="bi bi-shop"></i> Kondisi Toko
                </div>
                
                <div class="form-group">
                    <label for="storeCondition" class="form-label">Kondisi Toko <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="storeCondition" name="kondisi_toko" 
                           placeholder="Contoh: Bersih, Ada Stock, Perawatan">
                </div>
                
                <div class="form-group">
                    <label for="potensi" class="form-label">Potensi Penjualan</label>
                    <input type="text" class="form-control" id="potensi" name="potensi_penjualan" 
                           placeholder="Contoh: Tinggi, Sedang, Rendah">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Rating <span class="text-danger">*</span></label>
                    <div class="rating-stars" id="ratingStars">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                    <input type="hidden" id="rating" name="rating" value="0">
                </div>
                
                <div class="form-group">
                    <label for="notes" class="form-label">Catatan</label>
                    <textarea class="form-control" id="notes" name="catatan" rows="3" 
                              placeholder="Catatan tentang kunjungan..."></textarea>
                </div>
            </div>
            
            <!-- Step 4: Photo -->
            <div class="form-section">
                <div class="section-title">
                    <i class="bi bi-camera"></i> Foto Toko
                </div>
                
                <label class="photo-upload" id="photoUpload">
                    <input type="file" id="photoInput" name="photo" accept="image/*" capture="environment" hidden>
                    <div id="photoPrompt">
                        <i class="bi bi-camera" style="font-size: 32px; color: #0066cc;"></i>
                        <p style="margin-top: 10px; color: #666;">Ambil atau Pilih Foto Toko</p>
                    </div>
                </label>
                
                <div id="photoPreview"></div>
            </div>
            
            <!-- Submit -->
            <div class="button-group" style="position: sticky; bottom: 0; background: white; padding: 15px 0; margin-top: 30px;">
                <button type="button" class="btn-custom btn-cancel" onclick="window.history.back()">
                    Batal
                </button>
                <button type="submit" class="btn-custom btn-submit" id="btnSubmit">
                    <i class="bi bi-check-lg"></i> Simpan Check-In
                </button>
            </div>
        </form>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkin.js"></script>
</body>
</html>
