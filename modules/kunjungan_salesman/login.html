<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0066cc">
    <meta name="description" content="Login GeoMap CRM - Kunjungan Salesman">
    
    <title>Login - GeoMap Kunjungan Salesman</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/img/pwa-icon-192.png">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/kunjungan.css">
    
    <style>
        html, body {
            height: 100%;
            background: linear-gradient(135deg, #0066cc 0%, #004ba3 100%);
        }
        
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 15px;
        }
        
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0066cc;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .login-card p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-control {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 14px;
        }
        
        .form-control:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        
        .btn-login {
            background: #0066cc;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 6px;
            width: 100%;
            color: white;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            background: #004ba3;
            color: white;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 6px;
            margin-bottom: 20px;
            padding: 12px 15px;
            font-size: 14px;
        }
        
        .demo-info {
            background: #f0f7ff;
            border-left: 4px solid #0066cc;
            padding: 15px;
            border-radius: 4px;
            margin-top: 25px;
            font-size: 13px;
            color: #333;
        }
        
        .demo-info strong {
            display: block;
            margin-bottom: 8px;
            color: #0066cc;
        }
        
        .demo-credentials {
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .loading-spinner {
            display: none;
            margin-right: 8px;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            
            .login-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>GeoMap CRM</h1>
            <p>Kunjungan Salesman</p>
            
            <div id="alertContainer"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email / Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="email" 
                        name="email" 
                        placeholder="Masukkan email atau username"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-login">
                    <span class="loading-spinner" id="loginSpinner">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    </span>
                    Masuk
                </button>
            </form>
            
            <div class="demo-info">
                <strong>Demo Credentials:</strong>
                <div class="demo-credentials">
                    Email: salesman@geomap.local<br>
                    Pass: salesman123
                </div>
            </div>
        </div>
    </div>
    
    <script src="/service-worker-init.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => console.log('Service Worker registered'))
                .catch(error => console.log('Service Worker registration failed:', error));
        }
    </script>
</body>
</html>
